name: Build APK from zip
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          mkdir /tmp/app
          unzip -q "$(find . -iname '*.zip' | head -1)" -d /tmp/app
          cd "$(dirname "$(find /tmp/app -name package.json -not -path '*/node_modules/*' | head -1)")"
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: plates-manager-apk
          path: app-debug.apk
